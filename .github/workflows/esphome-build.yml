name: ESPHome firmware validation

on:
  push:
    branches:
      - refactor-esphome
  pull_request:
    branches:
      - dev-multi-user

jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/esphome/esphome:2026.10.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create build-only secrets
        run: |
          cat > esphome/secrets.yaml <<'EOF'
          wifi_ssid: "compile-test"
          wifi_password: "compile-test-password"
          fallback_ap_password: "compile-test-password"
          EOF
      - name: Validate ESPHome configuration
        run: esphome config esphome/phicomm-s7.yaml
      - name: Compile ESP8266 firmware
        run: esphome compile esphome/phicomm-s7.yaml
