# Phicomm S7 Body Fat Scale -- ESPHome Firmware
# Hardware: ESP8266 (CSM64F02) + CS1258 BIA AFE + MCU UART + Heater

esphome:
  name: phicomm-s7
  friendly_name: "斐讯 S7 体脂秤"
  platformio_options:
    board_build.flash_mode: qio
    board_build.ldscript: eagle.flash.1m64.ld

esp8266:
  board: esp12e
  restore_from_flash: true

logger:
  baud_rate: 0  # UART0 used by MCU, disable logger serial

preferences:
  flash_write_interval: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "S7-Fallback"
    password: !secret fallback_ap_password
    # 配网窗口：WiFi 组件默认 ap_timeout 只有 1min，热点 1 分钟后就关，
    # 用户来不及填账号密码（表现为"首次连接 WiFi 出不来"）。放宽到 15 分钟。
    ap_timeout: 15min

captive_portal:

api:
  id: api_server
  # No encryption for first-time setup. Add encryption key later if needed.
  actions:
    - action: set_active_member
      variables:
        member_id: int
      then:
        - lambda: |-
            id(mcu).set_active_member(member_id);
            ESP_LOGI("s7_record", "Active member set to %d", member_id);
    - action: ack_measurement
      variables:
        measurement_id: int
      then:
        - lambda: |-
            bool cleared = false;
            if (!id(outbox_1).empty() &&
                (uint32_t) strtoul(id(outbox_1).c_str(), nullptr, 10) == (uint32_t) measurement_id) {
              id(outbox_1).clear();
              cleared = true;
            }
            if (!id(outbox_2).empty() &&
                (uint32_t) strtoul(id(outbox_2).c_str(), nullptr, 10) == (uint32_t) measurement_id) {
              id(outbox_2).clear();
              cleared = true;
            }
            if (cleared) {
              ESP_LOGI("s7_record", "HA acknowledged measurement %u",
                       (unsigned) measurement_id);
            } else {
              ESP_LOGW("s7_record", "Ignored stale ACK id=%u",
                       (unsigned) measurement_id);
            }
  on_client_connected:
    then:
      - delay: 3s
      - homeassistant.action:
          action: script.s7_apply_profile
          on_error:
            - logger.log: "HA profile sync failed; retained last active member"
      - script.execute: send_pending_measurement

ota:
  platform: esphome

web_server:
  port: 80

# --- UART for MCU weight sensor ---
uart:
  tx_pin: TX
  rx_pin: RX
  baud_rate: 115200

# --- External components ---
external_components:
  - source:
      type: local
      path: components

# --- MCU weight sensor ---
s7_mcu:
  id: mcu
  cs1258_id: bia
  weight_hi: 0
  weight_lo: 1
  weight_div: 100.0
  weight_offset: 0.0
  weight:
    name: "Weight"
    id: weight_kg
    unit_of_measurement: "kg"
    accuracy_decimals: 2
    icon: "mdi:scale-bathroom"
    filters:
      - throttle: 1s
  weight_raw:
    name: "Weight Raw"
    entity_category: diagnostic
  mcu_alive:
    name: "MCU Online"
    id: mcu_alive
  measurement_id:
    name: "Measurement ID"
    id: measurement_id
  measurement_valid:
    name: "Measurement Valid"
    id: measurement_valid

# --- CS1258 BIA impedance sensor ---
cs1258:
  id: bia
  pin_cs: 16
  pin_clk: 14
  pin_dio: 12
  z_scale: 1.0
  z_offset: 0.0
  impedance:
    name: "Impedance"
    id: impedance_ohm
    icon: "mdi:flash-triangle"
  body_res:
    name: "Raw Impedance"
    id: body_res
    icon: "mdi:resistor"
    entity_category: diagnostic
  lr_leg:
    name: "CS1258 LR Leg"
    id: lr_leg
    entity_category: diagnostic
  rl_leg:
    name: "CS1258 RL Leg"
    id: rl_leg
    entity_category: diagnostic
  lr_hand:
    name: "CS1258 LR Hand"
    id: lr_hand
    entity_category: diagnostic
  r_leg:
    name: "CS1258 Right Leg"
    id: r_leg
    entity_category: diagnostic
  l_leg:
    name: "CS1258 Left Leg"
    id: l_leg
    entity_category: diagnostic
  lh_ll:
    name: "CS1258 LH-LL"
    id: lh_ll
    entity_category: diagnostic
  lh_rl:
    name: "CS1258 LH-RL"
    id: lh_rl
    entity_category: diagnostic
  rh_ll:
    name: "CS1258 RH-LL"
    id: rh_ll
    entity_category: diagnostic
  rh_rl:
    name: "CS1258 RH-RL"
    id: rh_rl
    entity_category: diagnostic
  z1:
    name: "CS1258 Z1"
    entity_category: diagnostic
  z2:
    name: "CS1258 Z2"
    entity_category: diagnostic
  z3:
    name: "CS1258 Z3"
    entity_category: diagnostic
  z4:
    name: "CS1258 Z4"
    entity_category: diagnostic
  z5:
    name: "CS1258 Z5"
    entity_category: diagnostic
  short_adc:
    name: "CS1258 Short ADC"
    entity_category: diagnostic
  cal_a:
    name: "CS1258 Cal A"
    entity_category: diagnostic
  cal_b:
    name: "CS1258 Cal B"
    entity_category: diagnostic
  scan_ms:
    name: "CS1258 Scan Duration"
    entity_category: diagnostic

# --- Heater ---
switch:
  - platform: gpio
    pin: 13
    id: heater_switch
    name: "Heater"
    icon: "mdi:radiator"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: heater_timeout

# --- User profile inputs ---
number:
  - platform: template
    name: "Age"
    id: user_age
    icon: "mdi:calendar-account"
    optimistic: true
    min_value: 10
    max_value: 99
    step: 1
    initial_value: 25
    restore_value: true
    mode: box
    on_value:
      then:
        - script.execute: calc_body_comp

  - platform: template
    name: "Height"
    id: user_height_cm
    icon: "mdi:human-male-height"
    optimistic: true
    min_value: 100
    max_value: 250
    step: 1
    initial_value: 175
    restore_value: true
    unit_of_measurement: "cm"
    mode: box
    on_value:
      then:
        - script.execute: calc_body_comp

select:
  - platform: template
    name: "Sex"
    id: user_sex
    icon: "mdi:gender-male-female"
    optimistic: true
    options:
      - "男"
      - "女"
    initial_option: "男"
    restore_value: true
    on_value:
      then:
        - script.execute: calc_body_comp

# --- Manual scan button ---
button:
  - platform: template
    name: "Scan Impedance"
    icon: "mdi:flash-triangle-outline"
    on_press:
      then:
        - lambda: |-
            id(bia).scan();
        - script.execute: calc_body_comp

# --- Body composition template sensors ---
sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 30s

  - platform: template
    name: "BMI"
    id: bmi
    icon: "mdi:human"
    unit_of_measurement: ""
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "Body Fat"
    id: body_fat_pct
    icon: "mdi:percent"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "Water"
    id: water_pct
    icon: "mdi:water-percent"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "Fat Free Mass"
    id: fat_free_mass
    icon: "mdi:arm-flex"
    unit_of_measurement: "kg"
    accuracy_decimals: 2
    state_class: measurement

  - platform: template
    name: "BMR"
    id: bmr_kcal
    icon: "mdi:fire"
    unit_of_measurement: "kcal"
    accuracy_decimals: 0
    state_class: measurement

  - platform: template
    name: "Muscle"
    id: muscle_pct
    icon: "mdi:arm-flex-outline"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "Bone Mass"
    id: bone_mass
    icon: "mdi:bone"
    unit_of_measurement: "kg"
    accuracy_decimals: 2
    state_class: measurement

# --- Automatic measurement state sync ---
globals:
  # Two compact CSV slots fit in ESP8266 flash preferences (128 bytes each).
  - id: outbox_1
    type: std::string
    restore_value: yes
    max_restore_data_length: 128
    initial_value: '""'
  - id: outbox_2
    type: std::string
    restore_value: yes
    max_restore_data_length: 128
    initial_value: '""'
  - id: last_seen_scan_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

interval:
  - interval: 500ms
    then:
      - lambda: |-
          const uint32_t scans = id(mcu).get_scan_count();
          if (scans != id(last_seen_scan_count)) {
            id(last_seen_scan_count) = scans;
            id(finalize_measurement).execute();
          }
  - interval: 15s
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - script.execute: send_pending_measurement

# --- Scripts ---
script:
  - id: send_pending_measurement
    mode: single
    then:
      - if:
          condition:
            lambda: 'return !id(outbox_1).empty();'
          then:
            - homeassistant.event:
                event: esphome.s7_measurement
                data_template:
                  record: "{{ record }}"
                variables:
                  record: !lambda 'return id(outbox_1);'
      - if:
          condition:
            lambda: 'return !id(outbox_2).empty();'
          then:
            - homeassistant.event:
                event: esphome.s7_measurement
                data_template:
                  record: "{{ record }}"
                variables:
                  record: !lambda 'return id(outbox_2);'

  - id: finalize_measurement
    mode: single
    then:
      - script.execute: calc_body_comp
      - delay: 300ms
      - lambda: |-
          if (!id(measurement_valid).state) {
            ESP_LOGW("s7_record", "Scan invalid; no record queued");
            return;
          }
          const std::string *slot = nullptr;
          if (id(outbox_1).empty()) slot = &id(outbox_1);
          else if (id(outbox_2).empty()) slot = &id(outbox_2);
          else {
            ESP_LOGE("s7_record", "Both outbox slots await ACK; measurement not queued");
            return;
          }
          const uint32_t mid = (uint32_t) random(1, 2147483647);
          char record[129];
          const int n = snprintf(
            record, sizeof(record),
            "%lu,%u,%.2f,%.1f,%.1f,%.1f,%.1f,%.2f,%.0f,%.1f,%.2f,%.0f,%.0f,%.0f,%.0f,%.0f,%.0f,%.0f,%.0f,%.0f",
            (unsigned long) mid, (unsigned) id(mcu).get_session_member(),
            id(weight_kg).state, id(impedance_ohm).state,
            id(bmi).state, id(body_fat_pct).state, id(water_pct).state,
            id(fat_free_mass).state, id(bmr_kcal).state, id(muscle_pct).state,
            id(bone_mass).state, id(lr_leg).state, id(rl_leg).state,
            id(lr_hand).state, id(r_leg).state, id(l_leg).state,
            id(lh_ll).state, id(lh_rl).state, id(rh_ll).state, id(rh_rl).state);
          if (n <= 0 || n >= (int) sizeof(record)) {
            ESP_LOGE("s7_record", "Record overflow (%d bytes); not queued", n);
            return;
          }
          *slot = record;
          ESP_LOGI("s7_record", "Prepared measurement %lu (%d bytes), member=%u",
                   (unsigned long) mid, n, (unsigned) id(mcu).get_session_member());
      - delay: 200ms
  # Restartable heater safety timeout, matching the Arduino deadline reset on each ON.
  - id: heater_timeout
    mode: restart
    then:
      - delay: 60s
      - switch.turn_off: heater_switch

  # Body composition calculation
  - id: calc_body_comp
    then:
      - lambda: |-
          float w = id(weight_kg).state;
          float z = id(impedance_ohm).state;
          float h_cm = id(user_height_cm).state;
          float h = h_cm / 100.0f;
          float age = id(user_age).state;
          bool male = true;
          auto idx = id(user_sex).active_index();
          if (idx.has_value()) male = (idx.value() == 0);  // 0=男, 1=女

          if (isnan(w) || isnan(h_cm) || isnan(age) || w <= 0 || h <= 0) return;

          // BMI
          float bmi_val = w / (h * h);
          id(bmi).publish_state(bmi_val);

          if (z <= 0 || isnan(z)) return;

          // LBM (bodymiscale / Xiaomi)
          float lbm = (h_cm * 9.058f / 100.0f) * (h_cm / 100.0f)
                    + w * 0.32f + 12.226f - z * 0.0068f - age * 0.0542f;
          if (lbm > w * 0.98f) lbm = w * 0.98f;
          if (lbm < 0) lbm = 0;
          id(fat_free_mass).publish_state(lbm);

          // Fat% (Xiaomi / Zepp Life)
          float adjust, coeff;
          if (male) {
            adjust = 0.8f;
            coeff = (w < 61.0f) ? 0.98f : 1.0f;
          } else {
            adjust = (age <= 49.0f) ? 9.25f : 7.25f;
            coeff = 1.0f;
            if (w > 60.0f) coeff = 0.96f * ((h_cm > 160.0f) ? 1.03f : 1.0f);
            else if (w < 50.0f) coeff = 1.02f * ((h_cm > 160.0f) ? 1.03f : 1.0f);
          }
          float fat = (1.0f - ((lbm - adjust) * coeff / w)) * 100.0f;
          if (fat < 5) fat = 5;
          if (fat > 75) fat = 75;
          id(body_fat_pct).publish_state(fat);

          // Water%
          float water = (100.0f - fat) * 0.7f;
          water *= (water <= 50.0f) ? 1.02f : 0.98f;
          if (water < 35) water = 35;
          if (water > 75) water = 75;
          id(water_pct).publish_state(water);

          // BMR (Katch-McArdle)
          float bmr = 370.0f + 21.6f * lbm;
          id(bmr_kcal).publish_state(bmr);

          // Bone mass
          float bone_base = male ? 0.18016894f : 0.245691014f;
          float bone = -1.0f * (bone_base - lbm * 0.05158f);
          bone += (bone > 2.2f) ? 0.1f : -0.1f;
          if (bone < 0.5f) bone = 0.5f;
          if (bone > 8.0f) bone = 8.0f;
          id(bone_mass).publish_state(bone);

          // Muscle mass
          float mus_kg = w - (fat * 0.01f * w) - bone;
          if (mus_kg < 10) mus_kg = 10;
          float mus_pct = mus_kg / w * 100.0f;
          id(muscle_pct).publish_state(mus_pct);
