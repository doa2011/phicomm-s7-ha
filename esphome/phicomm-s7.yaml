# Phicomm S7 Body Fat Scale -- ESPHome Firmware
# Hardware: ESP8266 (CSM64F02) + CS1258 BIA AFE + MCU UART + Heater

esphome:
  name: phicomm-s7
  friendly_name: "斐讯 S7 体脂秤"
  platformio_options:
    board_build.flash_mode: qio
    board_build.ldscript: eagle.flash.1m64.ld

esp8266:
  board: esp12e

logger:
  baud_rate: 0  # UART0 used by MCU, disable logger serial

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: "S7-Fallback"
    password: !secret fallback_ap_password
    # 配网窗口：WiFi 组件默认 ap_timeout 只有 1min，热点 1 分钟后就关，
    # 用户来不及填账号密码（表现为"首次连接 WiFi 出不来"）。放宽到 15 分钟。
    ap_timeout: 15min

captive_portal:

api:
  # No encryption for first-time setup. Add encryption key later if needed.

ota:
  platform: esphome

web_server:
  port: 80

# --- UART for MCU weight sensor ---
uart:
  tx_pin: TX
  rx_pin: RX
  baud_rate: 115200

# --- External components ---
external_components:
  - source:
      type: local
      path: components

# --- MCU weight sensor ---
s7_mcu:
  id: mcu
  cs1258_id: bia
  weight_hi: 0
  weight_lo: 1
  weight_div: 100.0
  weight_offset: 0.0
  weight:
    name: "Weight"
    id: weight_kg
    unit_of_measurement: "kg"
    accuracy_decimals: 2
    icon: "mdi:scale-bathroom"
    filters:
      - throttle: 1s
  mcu_alive:
    name: "MCU Online"
    id: mcu_alive

# --- CS1258 BIA impedance sensor ---
cs1258:
  id: bia
  pin_cs: 16
  pin_clk: 14
  pin_dio: 12
  z_scale: 1.0
  z_offset: 0.0
  impedance:
    name: "Impedance"
    id: impedance_ohm
    icon: "mdi:flash-triangle"
  body_res:
    name: "Raw Impedance"
    id: body_res
    icon: "mdi:resistor"
    entity_category: diagnostic
  lr_leg:
    name: "CS1258 LR Leg"
    entity_category: diagnostic
  rl_leg:
    name: "CS1258 RL Leg"
    entity_category: diagnostic
  lr_hand:
    name: "CS1258 LR Hand"
    entity_category: diagnostic
  r_leg:
    name: "CS1258 Right Leg"
    entity_category: diagnostic
  l_leg:
    name: "CS1258 Left Leg"
    entity_category: diagnostic
  lh_ll:
    name: "CS1258 LH-LL"
    entity_category: diagnostic
  lh_rl:
    name: "CS1258 LH-RL"
    entity_category: diagnostic
  rh_ll:
    name: "CS1258 RH-LL"
    entity_category: diagnostic
  rh_rl:
    name: "CS1258 RH-RL"
    entity_category: diagnostic

# --- Heater ---
switch:
  - platform: gpio
    pin: 13
    id: heater_switch
    name: "Heater"
    icon: "mdi:radiator"
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: heater_timeout

# --- User profile inputs ---
number:
  - platform: template
    name: "Age"
    id: user_age
    icon: "mdi:calendar-account"
    optimistic: true
    min_value: 10
    max_value: 99
    step: 1
    initial_value: 25
    restore_value: true
    mode: box
    on_value:
      then:
        - script.execute: calc_body_comp

  - platform: template
    name: "Height"
    id: user_height_cm
    icon: "mdi:human-male-height"
    optimistic: true
    min_value: 100
    max_value: 250
    step: 1
    initial_value: 175
    restore_value: true
    unit_of_measurement: "cm"
    mode: box
    on_value:
      then:
        - script.execute: calc_body_comp

select:
  - platform: template
    name: "Sex"
    id: user_sex
    icon: "mdi:gender-male-female"
    optimistic: true
    options:
      - "男"
      - "女"
    initial_option: "男"
    restore_value: true
    on_value:
      then:
        - script.execute: calc_body_comp

# --- Manual scan button ---
button:
  - platform: template
    name: "Scan Impedance"
    icon: "mdi:flash-triangle-outline"
    on_press:
      then:
        - lambda: |-
            id(bia).scan();
        - script.execute: calc_body_comp

# --- Body composition template sensors ---
sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 30s

  - platform: template
    name: "BMI"
    id: bmi
    icon: "mdi:human"
    unit_of_measurement: ""
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "Body Fat"
    id: body_fat_pct
    icon: "mdi:percent"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "Water"
    id: water_pct
    icon: "mdi:water-percent"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "Fat Free Mass"
    id: fat_free_mass
    icon: "mdi:arm-flex"
    unit_of_measurement: "kg"
    accuracy_decimals: 2
    state_class: measurement

  - platform: template
    name: "BMR"
    id: bmr_kcal
    icon: "mdi:fire"
    unit_of_measurement: "kcal"
    accuracy_decimals: 0
    state_class: measurement

  - platform: template
    name: "Muscle"
    id: muscle_pct
    icon: "mdi:arm-flex-outline"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement

  - platform: template
    name: "Bone Mass"
    id: bone_mass
    icon: "mdi:bone"
    unit_of_measurement: "kg"
    accuracy_decimals: 2
    state_class: measurement

# --- Automatic measurement state sync ---
globals:
  - id: last_seen_scan_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

interval:
  - interval: 500ms
    then:
      - lambda: |-
          const uint32_t scans = id(mcu).get_scan_count();
          if (scans != id(last_seen_scan_count)) {
            id(last_seen_scan_count) = scans;
            id(calc_body_comp).execute();
          }

# --- Scripts ---
script:
  # Restartable heater safety timeout, matching the Arduino deadline reset on each ON.
  - id: heater_timeout
    mode: restart
    then:
      - delay: 60s
      - switch.turn_off: heater_switch

  # Body composition calculation
  - id: calc_body_comp
    then:
      - lambda: |-
          float w = id(weight_kg).state;
          float z = id(impedance_ohm).state;
          float h_cm = id(user_height_cm).state;
          float h = h_cm / 100.0f;
          float age = id(user_age).state;
          bool male = true;
          auto idx = id(user_sex).active_index();
          if (idx.has_value()) male = (idx.value() == 0);  // 0=男, 1=女

          if (w <= 0 || h <= 0) return;

          // BMI
          float bmi_val = w / (h * h);
          id(bmi).publish_state(bmi_val);

          if (z <= 0 || isnan(z)) return;

          // LBM (bodymiscale / Xiaomi)
          float lbm = (h_cm * 9.058f / 100.0f) * (h_cm / 100.0f)
                    + w * 0.32f + 12.226f - z * 0.0068f - age * 0.0542f;
          if (lbm > w * 0.98f) lbm = w * 0.98f;
          if (lbm < 0) lbm = 0;
          id(fat_free_mass).publish_state(lbm);

          // Fat% (Xiaomi / Zepp Life)
          float adjust, coeff;
          if (male) {
            adjust = 0.8f;
            coeff = (w < 61.0f) ? 0.98f : 1.0f;
          } else {
            adjust = (age <= 49.0f) ? 9.25f : 7.25f;
            coeff = 1.0f;
            if (w > 60.0f) coeff = 0.96f * ((h_cm > 160.0f) ? 1.03f : 1.0f);
            else if (w < 50.0f) coeff = 1.02f * ((h_cm > 160.0f) ? 1.03f : 1.0f);
          }
          float fat = (1.0f - ((lbm - adjust) * coeff / w)) * 100.0f;
          if (fat < 5) fat = 5;
          if (fat > 75) fat = 75;
          id(body_fat_pct).publish_state(fat);

          // Water%
          float water = (100.0f - fat) * 0.7f;
          water *= (water <= 50.0f) ? 1.02f : 0.98f;
          if (water < 35) water = 35;
          if (water > 75) water = 75;
          id(water_pct).publish_state(water);

          // BMR (Katch-McArdle)
          float bmr = 370.0f + 21.6f * lbm;
          id(bmr_kcal).publish_state(bmr);

          // Bone mass
          float bone_base = male ? 0.18016894f : 0.245691014f;
          float bone = -1.0f * (bone_base - lbm * 0.05158f);
          bone += (bone > 2.2f) ? 0.1f : -0.1f;
          if (bone < 0.5f) bone = 0.5f;
          if (bone > 8.0f) bone = 8.0f;
          id(bone_mass).publish_state(bone);

          // Muscle mass
          float mus_kg = w - (fat * 0.01f * w) - bone;
          if (mus_kg < 10) mus_kg = 10;
          float mus_pct = mus_kg / w * 100.0f;
          id(muscle_pct).publish_state(mus_pct);
