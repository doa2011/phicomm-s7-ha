# Lovelace cards for the Phicomm S7 three-member workflow.
# Paste this vertical-stack into a dashboard YAML card.

type: vertical-stack
cards:
  - type: markdown
    title: 当前测量进度
    content: |
      {% set s = states('input_select.s7_measurement_status') %}
      {% set labels = {'Idle':'空闲，等待开始','Preparing':'正在准备测量','Waiting':'等待设备唤醒/等待上秤','Measuring':'正在测量，请保持站立','Saving':'测量完成，正在保存数据','Error':'准备失败，请检查设备和自动化'} %}
      {% set target = states('input_select.s7_measurement_target') %}
      {% set online = states('binary_sensor.phicomm_s7_mcu_online') %}
      **状态：{{ labels.get(s, s) }}**

      **测量对象：** {{ target if target not in ['unknown', 'unavailable', 'Unassigned'] else '未指定' }}

      **S7设备：** {{ '在线' if online == 'on' else '休眠/离线' }}

      {% if s == 'Waiting' and online != 'on' %}
      已记录测量对象。S7休眠时不会立即连接；请直接站上体脂秤唤醒设备。
      {% elif s == 'Waiting' %}
      设备已在线，正在等待测量开始；请保持站立。
      {% elif s == 'Measuring' %}
      正在采集体脂数据，请不要下秤。
      {% elif s == 'Saving' %}
      数据正在归档，完成后状态将自动恢复空闲。
      {% elif s == 'Error' %}
      请检查 Home Assistant 自动化执行轨迹及 ESPHome 设备连接状态。
      {% endif %}
  - type: entities
    title: 测量设备状态
    show_header_toggle: false
    entities:
      - entity: input_select.s7_measurement_status
        name: 测量状态
      - entity: input_select.s7_measurement_target
        name: 测量对象
      - entity: input_select.s7_active_person
        name: 当前锁定成员
      - entity: binary_sensor.phicomm_s7_mcu_online
        name: S7 MCU在线
      - entity: timer.s7_measurement_waiting
        name: 等待上秤倒计时
  - type: entities
    title: 体脂秤 · 成员 1
    show_header_toggle: false
    entities:
      - entity: input_number.s7_member1_age
        name: 年龄
      - entity: input_number.s7_member1_height
        name: 身高
      - entity: input_select.s7_member1_sex
        name: 性别
      - entity: sensor.s7_member_1_weight
        name: 体重
      - entity: sensor.s7_member_1_bmi
        name: BMI
      - entity: sensor.s7_member_1_body_fat
        name: 体脂率
      - entity: sensor.s7_member_1_water
        name: 水分率
      - entity: sensor.s7_member_1_muscle
        name: 肌肉率
      - entity: sensor.s7_member_1_bmr
        name: 基础代谢
      - entity: sensor.s7_member_1_bone_mass
        name: 骨量
      - entity: script.s7_measure_member1
        name: 开始测量
  - type: entities
    title: 体脂秤 · 成员 2
    show_header_toggle: false
    entities:
      - entity: input_number.s7_member2_age
        name: 年龄
      - entity: input_number.s7_member2_height
        name: 身高
      - entity: input_select.s7_member2_sex
        name: 性别
      - entity: sensor.s7_member_2_weight
        name: 体重
      - entity: sensor.s7_member_2_bmi
        name: BMI
      - entity: sensor.s7_member_2_body_fat
        name: 体脂率
      - entity: sensor.s7_member_2_water
        name: 水分率
      - entity: sensor.s7_member_2_muscle
        name: 肌肉率
      - entity: sensor.s7_member_2_bmr
        name: 基础代谢
      - entity: sensor.s7_member_2_bone_mass
        name: 骨量
      - entity: script.s7_measure_member2
        name: 开始测量
  - type: entities
    title: 体脂秤 · 成员 3
    show_header_toggle: false
    entities:
      - entity: input_number.s7_member3_age
        name: 年龄
      - entity: input_number.s7_member3_height
        name: 身高
      - entity: input_select.s7_member3_sex
        name: 性别
      - entity: sensor.s7_member_3_weight
        name: 体重
      - entity: sensor.s7_member_3_bmi
        name: BMI
      - entity: sensor.s7_member_3_body_fat
        name: 体脂率
      - entity: sensor.s7_member_3_water
        name: 水分率
      - entity: sensor.s7_member_3_muscle
        name: 肌肉率
      - entity: sensor.s7_member_3_bmr
        name: 基础代谢
      - entity: sensor.s7_member_3_bone_mass
        name: 骨量
      - entity: script.s7_measure_member3
        name: 开始测量
  - type: entities
    title: 体脂秤 · 测量状态
    entities:
      - entity: input_select.s7_measurement_target
      - entity: input_select.s7_measurement_status
