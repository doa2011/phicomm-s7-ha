      - name: S7 Member 2 BMI
        unique_id: s7_member2_bmi
        unit_of_measurement: "kg/m²"
        state_class: measurement
        availability: "{{ states('input_text.s7_member2_record').split(',')[0] == 'S7V2' }}"
        state: >-
