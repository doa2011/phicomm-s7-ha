        availability: "{{ states('input_text.s7_member2_record').split(',')[0] == 'S7V2' }}"
        state: >-
          {% set p = states('input_text.s7_member2_record').split(',') %}
          {{ p[6] | float(0) | round(1) if p | length > 6 else 0 }}
        attributes:
          measurement_id: >-
            {% set p = states('input_text.s7_member2_record').split(',') %}
            {{ p[1] if p | length > 1 else 'unknown' }}
          measured_at: "{{ states.input_text.s7_member2_record.last_changed }}"

      - name: S7 Member 2 Water
        unique_id: s7_member2_water
